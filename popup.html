<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --slate: #1c2130;
    --panel: #232939;
    --line: #353d55;
    --ink: #eef0f6;
    --muted: #9aa2ba;
    --accent: #ffe39a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 320px;
    background: var(--slate); color: var(--ink);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* live preview */
  .screen {
    position: sticky; top: 0; z-index: 2;
    height: 124px; padding: 12px;
    background: linear-gradient(160deg, #46586f 0%, #2d3a4c 45%, #6d5a44 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px;
    border-bottom: 1px solid var(--line);
  }
  .screen span {
    background: var(--ds-bg); text-shadow: var(--ds-shadow);
    padding: 1px 8px; border-radius: 3px; text-align: center; line-height: 1.3;
  }
  .screen .l1 {
    color: var(--ds-l1-color); font-size: var(--ds-l1-size);
    font-weight: var(--ds-l1-weight); font-style: var(--ds-l1-style); font-family: var(--ds-l1-font);
  }
  .screen .l2 {
    color: var(--ds-l2-color); font-size: var(--ds-l2-size);
    font-weight: var(--ds-l2-weight); font-style: var(--ds-l2-style); font-family: var(--ds-l2-font);
  }
  .langs { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; align-items: center; }
  .langs label { display: flex; flex-direction: column; gap: 3px; color: var(--muted); font-size: 12px; }
  .langs select { width: 100%; }
  .swap {
    grid-row: 1 / span 2; grid-column: 2; align-self: center;
    width: 34px; height: 34px; border-radius: 8px; cursor: pointer;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); font-size: 16px;
  }
  .swap:hover { border-color: var(--accent); }
  .screen.off span { opacity: .3; }

  main { padding: 4px 14px 14px; }
  details { border-bottom: 1px solid var(--line); }
  summary {
    list-style: none; cursor: pointer; padding: 11px 0;
    font-weight: 600; display: flex; justify-content: space-between; align-items: center;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "▸"; color: var(--muted); transition: transform .15s; }
  details[open] summary::after { transform: rotate(90deg); }
  .body { padding: 0 0 10px; }

  .row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 6px 0; min-height: 32px;
  }
  label.row { cursor: pointer; }
  .row > span:first-child { color: var(--ink); }
  .sub { color: var(--muted); }

  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .range { display: flex; align-items: center; gap: 8px; flex: 1; max-width: 170px; }
  .val { width: 38px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  .color-block { padding: 6px 0 4px; }
  .color-block .label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .palette { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .swatch {
    aspect-ratio: 1; width: 100%; border-radius: 50%; padding: 0; cursor: pointer;
    border: 2px solid var(--slate); box-shadow: 0 0 0 1px var(--line);
  }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
  .hex {
    width: 82px; padding: 3px 6px; border-radius: 6px; font: 12px ui-monospace, Menlo, monospace;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); text-transform: lowercase;
  }
  .hex.bad { border-color: #ff8a80; }
  .chip {
    display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    margin-left: auto; margin-right: 10px; box-shadow: 0 0 0 1px var(--line);
  }

  select {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 6px; font: inherit;
  }
  .toggles { display: flex; gap: 6px; }
  .toggle {
    width: 32px; height: 28px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    font: 15px Georgia, serif;
  }
  .toggle[aria-pressed="true"] { background: var(--accent); color: #1c2130; border-color: var(--accent); }

  button.reset {
    margin-top: 12px; width: 100%; padding: 8px; border-radius: 8px; cursor: pointer;
    background: transparent; color: var(--ink); border: 1px solid var(--line); font: inherit;
  }
  button.reset:hover { border-color: var(--muted); }
  .voice-select { max-width: 180px; }
  #testVoice { margin-top: 6px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  p.hint { margin: 10px 0 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <div class="screen" id="preview">
    <span class="l1" id="p1" dir="auto"></span>
    <span class="l2" id="p2" dir="auto"></span>
  </div>

  <main>
    <details open>
      <summary>Languages</summary>
      <div class="body langs">
        <label>Top line<select id="lang1"></select></label>
        <button class="swap" id="swap" title="Swap languages" aria-label="Swap top and bottom languages">⇅</button>
        <label>Bottom line<select id="lang2"></select></label>
      </div>
    </details>

    <details open>
      <summary>Voice-over</summary>
      <div class="body">
        <label class="row"><span>Read subtitles aloud</span><input type="checkbox" id="voiceOn"></label>
        <div class="row"><span>Read</span>
          <select id="voiceLine"><option value="1" id="vl1"></option><option value="2" id="vl2"></option></select>
        </div>
        <div class="row"><span>Voice</span><select id="voiceSelect" class="voice-select"></select></div>
        <div class="row"><span>Speed</span>
          <div class="range"><input type="range" id="voiceRate" min="0.7" max="1.6" step="0.1"><span class="val" id="voiceRateVal"></span></div>
        </div>
        <div class="row"><span>Original audio</span>
          <div class="range"><input type="range" id="voiceDuck" min="0" max="100" step="5"><span class="val" id="voiceDuckVal"></span></div>
        </div>
        <label class="row"><span>Pause if the voice falls behind</span><input type="checkbox" id="voicePauseBehind"></label>
        <button class="reset" id="testVoice">▶ Test voice</button>
        <p class="hint" id="voiceHint">Shortcut: Alt+Shift+V, or the speaker button in the YouTube player.</p>
      </div>
    </details>

    <details>
      <summary>Subtitles</summary>
      <div class="body">
        <label class="row"><span>Show dual subtitles</span><input type="checkbox" id="enabled"></label>
        <label class="row"><span>Show top line</span><input type="checkbox" id="show1"></label>
        <label class="row"><span>Show bottom line</span><input type="checkbox" id="show2"></label>
        <label class="row"><span>Hide YouTube's own captions</span><input type="checkbox" id="hideNative"></label>
      </div>
    </details>

    <details id="style-l1" open><summary><span id="l1Title"></span><span class="chip" id="l1Chip"></span></summary></details>
    <details id="style-l2"><summary><span id="l2Title"></span><span class="chip" id="l2Chip"></span></summary></details>

    <details>
      <summary>Background &amp; position</summary>
      <div class="body">
        <div id="bgColorSlot"></div>
        <div class="row"><span>Box opacity</span>
          <div class="range"><input type="range" id="bgOpacity" min="0" max="100" step="5"><span class="val" id="bgOpacityVal"></span></div>
        </div>
        <label class="row"><span>Text outline <span class="sub">(for no box)</span></span><input type="checkbox" id="textOutline"></label>
        <div class="row"><span>Raise subtitles</span>
          <div class="range"><input type="range" id="raise" min="0" max="60" step="1"><span class="val" id="raiseVal"></span></div>
        </div>
      </div>
    </details>

    <details>
      <summary>Word lookup</summary>
      <div class="body">
        <label class="row"><span>Define words on hover</span><input type="checkbox" id="wordLookup"></label>
        <label class="row"><span>Pause while hovering</span><input type="checkbox" id="pauseOnHover"></label>
        <label class="row"><span>Show example sentences</span><input type="checkbox" id="showExamples"></label>
        <label class="row"><span>Show synonyms</span><input type="checkbox" id="showSynonyms"></label>
      </div>
    </details>

    <button class="reset" id="reset">Reset to defaults</button>
    <p class="hint">Definitions, examples and synonyms come from Wiktionary. Refresh open YouTube tabs after updating.</p>
  </main>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
