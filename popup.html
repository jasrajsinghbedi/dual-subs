<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --slate: #1c2130;
    --panel: #252b3d;
    --line: #353d55;
    --ink: #eef0f6;
    --muted: #9aa2ba;
    --fr: #ffe39a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 290px;
    background: var(--slate); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .screen {
    background: #0b0d13;
    padding: 22px 12px 14px;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    min-height: 104px; justify-content: flex-end;
  }
  .screen span {
    background: rgba(8,8,8,.75); padding: 1px 8px; border-radius: 3px;
    text-align: center; line-height: 1.3;
  }
  .screen .en { color: #fff; }
  .screen .fr { color: var(--fr); }
  .screen.fr-first .fr { order: -1; }
  .screen.off { opacity: .35; }
  form { padding: 6px 16px 14px; }
  label.row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  label.row:last-of-type { border-bottom: 0; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--fr); }
  .size { padding-top: 12px; }
  .size div { display: flex; justify-content: space-between; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--fr); }
  input:focus-visible { outline: 2px solid var(--fr); outline-offset: 2px; }
  p.hint { margin: 10px 0 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <div class="screen" id="preview">
    <span class="en" id="pEn">Where are you going tonight?</span>
    <span class="fr" id="pFr">Où vas-tu ce soir ?</span>
  </div>
  <form id="form">
    <label class="row">Show dual subtitles <input type="checkbox" id="enabled"></label>
    <label class="row">English <input type="checkbox" id="showEn"></label>
    <label class="row">French <input type="checkbox" id="showFr"></label>
    <label class="row">Put French on top <input type="checkbox" id="frFirst"></label>
    <label class="row">Hide YouTube's own captions <input type="checkbox" id="hideNative"></label>
    <label class="row">Define words on hover <input type="checkbox" id="wordLookup"></label>
    <label class="row">Pause while hovering subtitles <input type="checkbox" id="pauseOnHover"></label>
    <label class="row">Show example sentences <input type="checkbox" id="showExamples"></label>
    <label class="row">Show synonyms <input type="checkbox" id="showSynonyms"></label>
    <div class="size">
      <div><span>Text size</span><span id="sizeVal"></span></div>
      <input type="range" id="fontSize" min="14" max="40" step="1">
    </div>
    <p class="hint">Works on videos that have captions. Definitions, examples and synonyms come from Wiktionary. Refresh open YouTube tabs after updating.</p>
  </form>
  <script src="popup.js"></script>
</body>
</html>
